<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vocab Harian</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VocabHarian" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="description" content="Hapal 100 kosakata bahasa Inggris setiap hari" />
  <link rel="apple-touch-icon" href="icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="72x72"  href="icons/icon-72.png" />
  <link rel="apple-touch-icon" sizes="96x96"  href="icons/icon-96.png" />
  <link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-card: #1e3a5f;
      --bg-card-done: #14532d; --accent-blue: #3b82f6; --accent-green: #22c55e;
      --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
      --border: #334155; --radius-card: 14px; --shadow-card: 0 4px 16px rgba(0,0,0,0.4);
      --shadow-done: 0 4px 16px rgba(34,197,94,0.25); --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html { background: var(--bg-primary); height: 100%; }
    body { font-family: var(--font); background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding-top: var(--safe-top); padding-bottom: calc(var(--safe-bottom) + 20px); overflow-x: hidden; }
    .app-header { position: sticky; top: 0; z-index: 100; background: rgba(15,23,42,0.92); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--border); padding: 14px 16px 10px; padding-top: calc(14px + var(--safe-top)); }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .app-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .date-badge { font-size: 0.72rem; font-weight: 600; background: var(--bg-secondary); color: var(--text-secondary); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); white-space: nowrap; }
    .header-progress { margin-top: 10px; }
    .progress-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .progress-text { font-size: 0.8rem; color: var(--text-secondary); }
    .progress-count { font-size: 0.85rem; font-weight: 700; color: var(--accent-green); }
    .progress-bar-track { background: var(--bg-secondary); border-radius: 99px; height: 6px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); border-radius: 99px; transition: width 0.4s cubic-bezier(.4,0,.2,1); width: 0%; }
    .filter-bar { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn { flex-shrink: 0; font-size: 0.75rem; font-weight: 600; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; -webkit-appearance: none; }
    .filter-btn.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
    .filter-btn:active { opacity: 0.75; }
    .main-content { padding: 16px 12px; max-width: 600px; margin: 0 auto; }
    .section-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; padding-left: 4px; display: flex; align-items: center; gap: 6px; }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 560px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
    .vocab-card { background: var(--bg-card); border: 1.5px solid rgba(59,130,246,0.3); border-radius: var(--radius-card); padding: 14px 12px; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s, background 0.3s, border-color 0.3s; user-select: none; -webkit-user-select: none; position: relative; overflow: hidden; box-shadow: var(--shadow-card); will-change: transform; min-height: 88px; display: flex; flex-direction: column; justify-content: space-between; }
    .vocab-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.04), transparent); pointer-events: none; }
    .vocab-card:active { transform: scale(0.95); }
    .vocab-card.done { background: var(--bg-card-done); border-color: rgba(34,197,94,0.4); box-shadow: var(--shadow-done); }
    .card-num { font-size: 0.62rem; font-weight: 700; color: rgba(255,255,255,0.25); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
    .vocab-card.done .card-num { color: rgba(74,222,128,0.4); }
    .card-en { font-size: 1rem; font-weight: 700; color: var(--text-primary); line-height: 1.3; margin-bottom: 5px; word-break: break-word; }
    .vocab-card.done .card-en { color: #bbf7d0; }
    .card-id { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.4; word-break: break-word; }
    .vocab-card.done .card-id { color: #86efac; }
    .card-check { position: absolute; top: 9px; right: 9px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-green); display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0.5); transition: opacity 0.25s, transform 0.25s cubic-bezier(.34,1.56,.64,1); }
    .vocab-card.done .card-check { opacity: 1; transform: scale(1); }
    .card-check svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 2.5; fill: none; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state .emoji-big { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; line-height: 1.6; }
    .all-done-banner { display: none; background: linear-gradient(135deg, #14532d, #166534); border: 1px solid #22c55e33; border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 16px; }
    .all-done-banner.show { display: block; }
    .all-done-banner .big-emoji { font-size: 2.5rem; margin-bottom: 8px; }
    .all-done-banner h2 { font-size: 1.1rem; color: #4ade80; margin-bottom: 4px; }
    .all-done-banner p { font-size: 0.8rem; color: #86efac; }
    .footer-actions { margin-top: 24px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .btn-reset { font-size: 0.8rem; font-weight: 600; padding: 10px 20px; border-radius: 10px; border: 1.5px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; -webkit-appearance: none; display: flex; align-items: center; gap: 6px; }
    .btn-reset:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .btn-reset:active { opacity: 0.7; }
    .btn-primary { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    #loading-screen { position: fixed; inset: 0; background: var(--bg-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 16px; }
    .loader-emoji { font-size: 3rem; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.9); opacity: 0.6; } }
    .loader-text { font-size: 0.9rem; color: var(--text-secondary); }
    #toast { position: fixed; bottom: calc(24px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(80px); background: #1e293b; border: 1px solid var(--border); border-radius: 99px; padding: 10px 20px; font-size: 0.82rem; color: var(--text-primary); white-space: nowrap; z-index: 500; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s; opacity: 0; pointer-events: none; }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #ios-banner { display: none; position: fixed; bottom: calc(12px + var(--safe-bottom)); left: 12px; right: 12px; background: #1e293b; border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; z-index: 200; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    #ios-banner .banner-inner { display: flex; align-items: flex-start; gap: 12px; }
    #ios-banner .banner-icon { font-size: 1.8rem; flex-shrink: 0; }
    #ios-banner .banner-text { flex: 1; }
    #ios-banner .banner-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 3px; }
    #ios-banner .banner-desc { font-size: 0.75rem; color: var(--text-secondary); line-height: 1.4; }
    #ios-banner .banner-close { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 0; line-height: 1; align-self: flex-start; }
    @keyframes cardFlip { 0% { transform: rotateY(0deg); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0deg); } }
    .vocab-card.flipping { animation: cardFlip 0.3s ease; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  </style>
</head>
<body>
<div id="loading-screen">
  <div class="loader-emoji">📚</div>
  <div class="loader-text">Memuat kosakata hari ini…</div>
</div>
<header class="app-header">
  <div class="header-top">
    <div class="app-title"><span>📖</span> Vocab Harian</div>
    <div class="date-badge" id="date-badge">–</div>
  </div>
  <div class="header-progress">
    <div class="progress-info">
      <span class="progress-text">Sudah hapal hari ini</span>
      <span class="progress-count" id="progress-count">0 / 100</span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-bar"></div></div>
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">Semua</button>
    <button class="filter-btn" data-filter="todo">Belum Hapal</button>
    <button class="filter-btn" data-filter="done">Sudah Hapal ✓</button>
  </div>
</header>
<main class="main-content" id="main-content">
  <div class="all-done-banner" id="all-done-banner">
    <div class="big-emoji">🎉</div>
    <h2>Luar biasa! Semua hapal!</h2>
    <p>Kamu sudah menghapal 100 kata hari ini.<br>Datang lagi besok untuk 100 kata baru!</p>
  </div>
  <div class="section-label" id="section-label">Kata hari ini</div>
  <div class="cards-grid" id="cards-grid"></div>
  <div class="footer-actions">
    <button class="btn-reset" onclick="resetToday()">🔄 Reset Hari Ini</button>
    <button class="btn-reset btn-primary" onclick="markAllDone()">✅ Hapal Semua</button>
  </div>
</main>
<div id="toast"></div>
<div id="ios-banner">
  <div class="banner-inner">
    <div class="banner-icon">📲</div>
    <div class="banner-text">
      <div class="banner-title">Install ke Home Screen</div>
      <div class="banner-desc">Tap ikon <strong>Bagikan</strong> (□↑) lalu pilih <strong>"Add to Home Screen"</strong></div>
    </div>
    <button class="banner-close" onclick="dismissIosBanner()">✕</button>
  </div>
</div>
<script>
  const LS_MEMORIZED='vh_memorized_ids',LS_DATE='vh_last_date',LS_IOS_BANNER='vh_ios_banner_shown',WORDS_PER_DAY=100;
  let allWords=[],todayWords=[],memorizedSet=new Set(),currentFilter='all';

  function todayString(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;}
  function getDayOfYear(){const now=new Date(),start=new Date(now.getFullYear(),0,0),diff=now-start,oneDay=86400000;return Math.floor(diff/oneDay);}
  function readableDate(){return new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
  function loadMemorized(){try{const r=localStorage.getItem(LS_MEMORIZED);return r?new Set(JSON.parse(r)):new Set();}catch{return new Set();}}
  function saveMemorized(){localStorage.setItem(LS_MEMORIZED,JSON.stringify([...memorizedSet]));}
  function checkDateReset(){const s=localStorage.getItem(LS_DATE),t=todayString();if(s!==t){memorizedSet=new Set();localStorage.removeItem(LS_MEMORIZED);localStorage.setItem(LS_DATE,t);if(s)setTimeout(()=>showToast('🌅 Hari baru! Kata-kata direset.'),500);}else{memorizedSet=loadMemorized();}}
  function getTodayWords(w){const total=w.length,day=getDayOfYear(),grp=Math.ceil(total/WORDS_PER_DAY),idx=(day-1)%grp,start=idx*WORDS_PER_DAY;return w.slice(start,start+WORDS_PER_DAY);}
  function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  function renderCards(){
    const grid=document.getElementById('cards-grid');grid.innerHTML='';
    let vis=currentFilter==='done'?todayWords.filter(w=>memorizedSet.has(w.id)):currentFilter==='todo'?todayWords.filter(w=>!memorizedSet.has(w.id)):todayWords;
    if(!vis.length){const e=document.createElement('div');e.className='empty-state';e.style.gridColumn='1/-1';e.innerHTML=currentFilter==='done'?'<div class="emoji-big">📝</div><p>Belum ada kata yang dihapal.<br>Tap kartu biru!</p>':'<div class="emoji-big">🎉</div><p>Semua kata sudah dihapal!</p>';grid.appendChild(e);return;}
    vis.forEach((word,i)=>{const done=memorizedSet.has(word.id),card=document.createElement('div');card.className='vocab-card'+(done?' done':'');card.dataset.id=word.id;card.innerHTML=`<div class="card-num">#${String(i+1).padStart(3,'0')}</div><div class="card-en">${escapeHtml(word.en)}</div><div class="card-id">${escapeHtml(word.id_)}</div><div class="card-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`;card.addEventListener('click',()=>toggleCard(word.id,card));grid.appendChild(card);});
  }

  function toggleCard(wordId,cardEl){
    cardEl.classList.add('flipping');setTimeout(()=>cardEl.classList.remove('flipping'),300);
    if(memorizedSet.has(wordId)){memorizedSet.delete(wordId);cardEl.classList.remove('done');}
    else{memorizedSet.add(wordId);cardEl.classList.add('done');}
    saveMemorized();updateProgress();checkAllDone();
    if(currentFilter!=='all')setTimeout(()=>{renderCards();updateSectionLabel();},350);
  }

  function updateProgress(){const t=todayWords.length,d=todayWords.filter(w=>memorizedSet.has(w.id)).length,p=t>0?(d/t)*100:0;document.getElementById('progress-count').textContent=`${d} / ${t}`;document.getElementById('progress-bar').style.width=`${p}%`;}
  function checkAllDone(){const t=todayWords.length,d=todayWords.filter(w=>memorizedSet.has(w.id)).length,b=document.getElementById('all-done-banner');d===t&&t>0?b.classList.add('show'):b.classList.remove('show');}
  function updateSectionLabel(){const l=document.getElementById('section-label'),day=getDayOfYear(),total=allWords.length,grp=Math.ceil(total/WORDS_PER_DAY),idx=(day-1)%grp,start=idx*WORDS_PER_DAY+1,end=Math.min(start+WORDS_PER_DAY-1,total);l.textContent=`Kata ke-${start} s/d ${end} dari ${total} total`;}

  document.querySelectorAll('.filter-btn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.filter;renderCards();});});

  function resetToday(){if(!confirm('Reset semua hapalan hari ini?'))return;memorizedSet=new Set();saveMemorized();renderCards();updateProgress();checkAllDone();showToast('🔄 Hapalan hari ini direset!');}
  function markAllDone(){todayWords.forEach(w=>memorizedSet.add(w.id));saveMemorized();renderCards();updateProgress();checkAllDone();showToast('✅ Semua kata ditandai hapal!');}

  let toastTimer=null;
  function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);}

  function isIos(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
  function isStandalone(){return window.navigator.standalone===true;}
  function showIosBannerIfNeeded(){if(isIos()&&!isStandalone()&&!localStorage.getItem(LS_IOS_BANNER))setTimeout(()=>{document.getElementById('ios-banner').style.display='block';},2000);}
  function dismissIosBanner(){document.getElementById('ios-banner').style.display='none';localStorage.setItem(LS_IOS_BANNER,'1');}

  async function init(){
    try{
      const res=await fetch('./data.json');
      if(!res.ok)throw new Error('Gagal memuat data.json');
      allWords=await res.json();
      checkDateReset();
      todayWords=getTodayWords(allWords);
      document.getElementById('date-badge').textContent=readableDate();
      renderCards();updateProgress();checkAllDone();updateSectionLabel();
      showIosBannerIfNeeded();
      if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }catch(err){
      console.error(err);
      document.getElementById('cards-grid').innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="emoji-big">⚠️</div><p>Gagal memuat data.<br>${err.message}</p></div>`;
    }finally{document.getElementById('loading-screen').style.display='none';}
  }
  init();
</script>
</body>
</html>
